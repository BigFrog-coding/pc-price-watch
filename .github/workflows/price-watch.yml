name: PC price watch

on:
  schedule:
    - cron: "0 13,23 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email only (skip shopping searches)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run price filter unit tests
        run: python -m unittest discover -s tests -v
      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python price_watch.py --test-email
      - name: Search prices and send email alerts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_email }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python price_watch.py
      - name: Save alert history
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_email }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update price watch alert history"
            git push
          fi
